name: Android Debug APK Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Ensure working dir is flutter
        run: pwd && ls -la
        working-directory: ./flutter

      - name: Decode google-services.json (if provided as secret)
        if: secrets.GOOGLE_SERVICES_JSON != ''
        run: |
          mkdir -p flutter/android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > flutter/android/app/google-services.json

      - name: Install Flutter dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Build debug APK (from flutter folder)
        run: |
          cd flutter
          flutter build apk --debug -t lib/main.dart

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrax-debug-apk
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          
